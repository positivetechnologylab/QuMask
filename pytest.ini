[pytest]
# Register custom markers so `pytest --markers` lists them and `-m` filtering works
# without PytestUnknownMarkWarning.
markers =
    slow: marks tests that invoke Qiskit simulation or generate real training data
          (deselect with: pytest -m "not slow")

# Always run with short traceback and show local variables on failure.
addopts = --tb=short -l

# Discover tests only inside the tests/ directory.
testpaths = tests
